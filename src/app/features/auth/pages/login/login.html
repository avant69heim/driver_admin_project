<section class="bg-gradient-to-br from-primary-100 via-primary-50 to-secondary-50 dark:bg-gradient-to-br dark:from-primary-800 dark:via-primary-700 dark:to-secondary-800">
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
        <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-primary-800 dark:text-primary-200">
            <!-- EIV ROUTE Logo -->
            <div class="w-12 h-12 mr-3 rounded-full bg-primary-600 border-4 border-secondary-500 flex items-center justify-center shadow-lg">
                <div class="text-secondary-300 font-bold text-lg">EIV</div>
            </div>
            <span class="text-primary-700 dark:text-primary-400">EIV</span>
            <span class="text-secondary-600 dark:text-secondary-400 ml-1">ROUTE</span>
        </a>
        <div class="w-full bg-neutral-0 rounded-lg shadow-xl border-2 border-primary-200 dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-primary-50 dark:border-primary-300">
            <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                <div class="text-center pb-4 border-b border-primary-100 dark:border-primary-900">
                    <h1 class="text-xl font-bold leading-tight tracking-tight text-primary-800 md:text-2xl dark:text-primary-300">
                        Welcome to EIV Route
                    </h1>
                    <p class="text-sm text-primary-600 dark:text-primary-300 mt-2">Sign in to access your driver dashboard</p>
                </div>
                <form class="space-y-4 md:space-y-6" action="#" [formGroup]="loginForm">
                    <div>
                        <label for="email" class="block mb-2 text-sm font-medium text-primary-700 dark:text-primary-300">Your email</label>
                        <input type="email" name="email" id="email" class="login-input bg-primary-50 border border-primary-200 text-primary-800 rounded-lg focus:ring-primary-600 focus:border-primary-600 focus:outline-none block w-full p-2.5 dark:bg-primary-100 dark:border-primary-300 dark:placeholder-primary-400 dark:text-primary-800 dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:focus:outline-none" placeholder="name@company.com" formControlName="username">
                    </div>
                    <div>
                        <label for="password" class="block mb-2 text-sm font-medium text-primary-700 dark:text-primary-300">Password</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" class="login-input bg-primary-50 border border-primary-200 text-primary-800 rounded-lg focus:ring-primary-600 focus:border-primary-600 focus:outline-none block w-full p-2.5 dark:bg-primary-100 dark:border-primary-300 dark:placeholder-primary-400 dark:text-primary-800 dark:focus:ring-primary-500 dark:focus:border-primary-500 dark:focus:outline-none" formControlName="password">
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-start">
                            <div class="flex items-center h-5">
                                <input id="remember" aria-describedby="remember" type="checkbox" class="w-4 h-4 border border-primary-300 rounded bg-primary-50 focus:ring-3 focus:ring-primary-300 dark:bg-primary-100 dark:border-primary-400 dark:focus:ring-primary-600 dark:ring-offset-primary-100" formControlName="remember">
                            </div>
                            <div class="ml-3 text-sm">
                                <label for="remember" class="text-primary-600 dark:text-primary-400">Remember me</label>
                            </div>
                        </div>
                        <a href="#" class="text-sm font-medium text-primary-600 hover:underline dark:text-primary-500">Forgot password?</a>
                    </div>
                    <button class="w-full text-neutral-0 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:from-primary-600 dark:to-primary-700 dark:hover:from-primary-700 dark:hover:to-primary-800 dark:focus:ring-primary-800 shadow-lg transform hover:scale-105 transition-all duration-200" (click)="validateForm()">
                        <span class="flex items-center justify-center">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.293l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd"></path>
                            </svg>
                            Sign in to EIV Route
                        </span>
                    </button>
                    <p class="text-sm font-light text-primary-600 dark:text-primary-400">
                        Don’t have an account yet? <a href="#" class="font-medium text-primary-800 hover:underline hover:text-primary-900 dark:text-primary-700 dark:hover:text-primary-600">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
