<!-- Dashboard Admin Navbar -->
<nav class="fixed top-0 z-header w-full bg-primary-500 border-b border-primary-200 dark:bg-primary-700 dark:border-primary-50">
    <div class="px-3 py-3 lg:px-5 lg:pl-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center justify-start">
                <!-- Mobile Sidebar Toggle Button -->
                <button
                    (click)="toggleSidebar()"
                    type="button"
                    class="inline-flex items-center p-2 text-sm text-primary-100 rounded-lg md:hidden hover:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-secondary-300 dark:text-primary-200 dark:hover:bg-primary-700 dark:focus:ring-secondary-500"
                    aria-controls="logo-sidebar"
                    [attr.aria-expanded]="isSidebarOpen">
                    <span class="sr-only">Abrir barra lateral</span>
                    <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
                    </svg>
                </button>

                <!-- Brand/Logo -->
                <a href="#" class="flex ms-2 md:me-24">
                    <img src="https://flowbite.com/docs/images/logo.svg" class="h-6 me-3 sm:h-8" alt="Logo Conductor Profesional" />
                    <span class="self-center text-lg sm:text-xl font-semibold whitespace-nowrap text-primary-0 dark:text-primary-50">
                        <span class="hidden sm:inline">Profesionales al Volante</span>
                        <span class="sm:hidden text-left leading-none">
                            <span class="block text-xs font-medium">Profesionales al</span>
                            <span class="block text-xs font-medium">Volante</span>
                        </span>
                    </span>
                </a>
            </div>

            <!-- Right side content -->
            <div class="flex items-center">
                <div class="flex items-center ms-3">
                    <!-- Dark Mode Toggle -->
                    <button
                        id="theme-toggle"
                        type="button"
                        (click)="toggleDarkMode()"
                        class="text-primary-0 dark:text-primary-200 hover:bg-primary-500 dark:hover:bg-primary-700 focus:outline-none focus:ring-4 focus:ring-secondary-300 dark:focus:ring-secondary-500 rounded-lg text-sm p-2.5 me-2">
                        <span class="sr-only">Alternar modo oscuro</span>
                        <svg
                            id="theme-toggle-dark-icon"
                            [class]="isDarkMode ? 'hidden w-5 h-5' : 'w-5 h-5'"
                            fill="currentColor"
                            viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        <svg
                            id="theme-toggle-light-icon"
                            [class]="isDarkMode ? 'w-5 h-5' : 'hidden w-5 h-5'"
                            fill="currentColor"
                            viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                        </svg>
                    </button>

                    <!-- Notifications (Hidden on mobile) -->
                    <button type="button" class="hidden sm:flex p-2 text-primary-100 rounded-lg hover:text-primary-0 hover:bg-primary-500 dark:text-primary-200 dark:hover:text-primary-0 dark:hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-secondary-300 dark:focus:ring-secondary-500">
                        <span class="sr-only">Ver notificaciones</span>
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 14 20">
                            <path d="M12.133 10.632v-1.8A5.406 5.406 0 0 0 7.979 3.57.946.946 0 0 0 8 3.464V1.1a1 1 0 0 0-2 0v2.364a.946.946 0 0 0 .021.106 5.406 5.406 0 0 0-4.154 5.262v1.8C1.867 13.018 0 13.614 0 14.807 0 15.4 0 16 .538 16h12.924C14 16 14 15.4 14 14.807c0-1.193-1.867-1.789-1.867-4.175ZM3.823 17a3.453 3.453 0 0 0 6.354 0H3.823Z"/>
                        </svg>
                    </button>

                    <!-- User Menu -->
                    <div class="relative">
                        <button
                            type="button"
                            class="flex text-sm bg-secondary-600 rounded-full focus:ring-4 focus:ring-secondary-300 dark:focus:ring-secondary-500 ms-3 border-2 border-secondary-500"
                            (click)="toggleUserMenu()"
                            [attr.aria-expanded]="isUserMenuOpen">
                            <span class="sr-only">Abrir menú de usuario</span>
                            <img class="w-8 h-8 rounded-full" src="https://flowbite.com/docs/images/people/profile-picture-5.jpg" alt="foto de usuario">
                        </button>

                        <!-- User Dropdown -->
                        <div
                            [class]="'z-dropdown absolute right-0 mt-2 w-44 sm:w-56 text-base list-none bg-primary-50 divide-y divide-primary-200 rounded-lg shadow-xl border border-primary-200 dark:bg-gray-800 dark:divide-gray-600 dark:border-gray-600 ' + (isUserMenuOpen ? 'block' : 'hidden')"
                            id="dropdown-user">
                            <div class="px-4 py-3">
                                <p class="text-sm text-primary-700 dark:text-primary-50 font-semibold">Usuario Demo</p>
                                <p class="text-sm font-medium text-primary-600 truncate dark:text-primary-50">usuario.demo&#64;conductor-profesional.com</p>
                            </div>
                            <ul class="py-1 font-light text-primary-800 dark:text-primary-50">
                                <li>
                                    <a href="#" class="block py-2 px-4 text-sm text-primary-400 hover:bg-primary-100 hover:text-primary-500 dark:text-primary-50 dark:hover:bg-primary-700 dark:hover:text-primary-0 transition-all duration-200">Mi perfil</a>
                                </li>
                                <li>
                                    <a href="#" class="block py-2 px-4 text-sm text-primary-400 hover:bg-primary-100 hover:text-primary-500 dark:text-primary-50 dark:hover:bg-primary-700 dark:hover:text-primary-0 transition-all duration-200">Configuración de cuenta</a>
                                </li>
                            </ul>
                            <ul class="py-1 font-light text-primary-400 dark:text-primary-50">
                                <li>
                                    <a href="#" class="flex items-center py-2 px-4 text-sm text-primary-400 hover:bg-primary-100 hover:text-primary-500 dark:text-primary-50 dark:hover:bg-primary-700 dark:hover:text-primary-0 transition-all duration-200">
                                        <svg class="mr-2 w-5 h-5 text-primary-400 group-hover:text-primary-500 dark:text-primary-50 dark:group-hover:text-primary-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                                        Mis favoritos
                                    </a>
                                </li>
                                <li>
                                    <a href="#" class="flex items-center py-2 px-4 text-sm text-primary-400 hover:bg-primary-100 hover:text-primary-500 dark:text-primary-50 dark:hover:bg-primary-700 dark:hover:text-primary-0 transition-all duration-200">
                                        <svg class="mr-2 w-5 h-5 text-primary-400 group-hover:text-primary-500 dark:text-primary-50 dark:group-hover:text-primary-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
                                        Colecciones
                                    </a>
                                </li>
                            </ul>
                            <ul class="py-1 font-light text-primary-400 dark:text-primary-50">
                                <li>
                                    <a href="#" class="block py-2 px-4 text-sm text-primary-400 hover:bg-primary-100 hover:text-primary-500 dark:text-primary-50 dark:hover:bg-primary-700 dark:hover:text-primary-0 transition-all duration-200 font-medium">Cerrar sesión</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
