<!-- Main Layout Structure -->
<div class="app-layout min-h-screen bg-neutral-50 dark:bg-neutral-900">
  @if (showHeader()) {
    <!-- Header/Navbar -->
    <app-header (sidebarToggle)="toggleSidebar()"></app-header>
    
    <!-- Sidebar -->
    <app-menu [isOpen]="isSidebarOpen" (closeMenu)="toggleSidebar()"></app-menu>
    
    <!-- Mobile Overlay - Behind sidebar, covers main content only -->
    @if (isSidebarOpen) {
      <div 
        class="fixed inset-0 z-overlay bg-neutral-900/60 dark:bg-neutral-900/70 md:hidden transition-opacity duration-300 ease-in-out" 
        (click)="toggleSidebar()"
        aria-hidden="true">
      </div>
    }
    
    <!-- Main Content Area with proper margins for sidebar and header -->
    <main class="pt-16 md:ml-64 transition-all duration-300 ease-in-out">
      <div class="p-4 sm:p-6 lg:p-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  } @else {
    <!-- Full width content for pages without header/sidebar (like login) -->
    <main class="w-full h-full">
      <router-outlet></router-outlet>
    </main>
  }

  <!-- Global Loading Component -->
  <app-loading></app-loading>
</div>
